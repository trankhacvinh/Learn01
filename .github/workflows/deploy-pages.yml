name: Deploy Learn01 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download curated 3D assets
        run: |
          set -euxo pipefail
          mkdir -p public/models/external

          # Kenney Toy Car Kit — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/car.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-racer.glb
          curl -L --fail --retry 3 \
            -o public/models/external/truck.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-monster-truck.glb
          curl -L --fail --retry 3 \
            -o public/models/external/box.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/item-box.glb

          # Kenney Car Kit — CC0. These three have distinct emergency-vehicle silhouettes.
          curl -L --fail --retry 3 \
            -o public/models/external/fire-truck.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/firetruck.glb
          curl -L --fail --retry 3 \
            -o public/models/external/ambulance.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/ambulance.glb
          curl -L --fail --retry 3 \
            -o public/models/external/police-car.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/police.glb

          # Gobkit Corgi — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/dog.glb \
            https://raw.githubusercontent.com/Ariescar/gobkit-free-assets/main/animal/Corgi.glb

          # Poly Pizza models. The IDs and licenses are documented in 3d-asset-credits.html.
          # Rabbit is Quaternius CC0; Lion/Elephant/Bear are CC-BY 3.0 and credited in-app.
          python3 - <<'PY'
          import re
          import time
          import urllib.request
          from pathlib import Path

          assets = {
              'rabbit': 'mKev485XTR',
              'lion': '3XAJojWxSWz',
              'elephant': 'a27MA0rXyyj',
              'bear': 'evjB26aGfTh',
          }
          out_dir = Path('public/models/external')
          headers = {'User-Agent': 'Mozilla/5.0 Learn01 asset build'}

          for name, model_id in assets.items():
              page_url = f'https://poly.pizza/m/{model_id}'
              page = urllib.request.urlopen(
                  urllib.request.Request(page_url, headers=headers), timeout=60
              ).read().decode('utf-8', 'ignore')
              matches = re.findall(r'https://static\.poly\.pizza/[0-9a-f-]+\.glb', page)
              if not matches:
                  raise RuntimeError(f'No GLB download found for {name} ({model_id})')
              glb_url = matches[0]
              data = urllib.request.urlopen(
                  urllib.request.Request(glb_url, headers=headers), timeout=120
              ).read()
              (out_dir / f'{name}.glb').write_bytes(data)
              print(f'{name}: {len(data) // 1024} KiB from {model_id}')
              time.sleep(0.6)
          PY

          ls -lh public/models/external

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
