name: Deploy Learn01 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download CC0 3D assets
        run: |
          set -euxo pipefail
          mkdir -p public/models/external

          # Kenney Toy Car Kit — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/car.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-racer.glb
          curl -L --fail --retry 3 \
            -o public/models/external/truck.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-monster-truck.glb
          curl -L --fail --retry 3 \
            -o public/models/external/box.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/item-box.glb

          # Gobkit free Corgi — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/dog.glb \
            https://raw.githubusercontent.com/Ariescar/gobkit-free-assets/main/animal/Corgi.glb

          ls -lh public/models/external

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
