name: Deploy Learn01 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download curated 3D assets
        run: |
          set -euxo pipefail
          mkdir -p public/models/external

          # Kenney Toy Car Kit — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/car.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-racer.glb
          curl -L --fail --retry 3 \
            -o public/models/external/truck.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/vehicle/vehicle-monster-truck.glb
          curl -L --fail --retry 3 \
            -o public/models/external/box.glb \
            https://raw.githubusercontent.com/chrisizeful/Operations/a989794e0c45de9e595cfd5b056054f80ca7c0d8/assets/kenney_toy-car-kit/item-box.glb

          # Kenney Car Kit — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/fire-truck.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/firetruck.glb
          curl -L --fail --retry 3 \
            -o public/models/external/ambulance.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/ambulance.glb
          curl -L --fail --retry 3 \
            -o public/models/external/police-car.glb \
            https://raw.githubusercontent.com/kidscancode/3d_car_sphere/cabc5c0019e68913012fc41d7b2ded6dcef3be31/assets/kenney_car_kit/police.glb

          # Gobkit Corgi — CC0
          curl -L --fail --retry 3 \
            -o public/models/external/dog.glb \
            https://raw.githubusercontent.com/Ariescar/gobkit-free-assets/main/animal/Corgi.glb

          # Quaternius Rabbit — CC0, optimized mirror with source/license documented.
          curl -L --fail --retry 3 \
            -o public/models/external/rabbit.glb \
            https://raw.githubusercontent.com/AryaaSk/Zootropolis/700b1e062241524bab573323b22440bfa3df3886/paperclip-master/ui/public/assets/zootropolis/animals/rabbit.glb

          # Poly by Google Lion — CC BY 3.0, mirrored with credit metadata.
          curl -L --fail --retry 3 \
            -o public/models/external/lion.glb \
            https://raw.githubusercontent.com/mrshippers/peoples-of-africa/7923b740cc0030c1dc8de8646ba17af3f79328ed/public/models/lion.glb

          # Poly by Google Elephant — CC BY 3.0, source documented in mirror credits.
          curl -L --fail --retry 3 \
            -o public/models/external/elephant.glb \
            https://raw.githubusercontent.com/Alexander-Jordan/mitt-spel-om-bibeln/eedee2ecb19019f90bad7aa71cc9679aa0665bb9/assets/models/animals/elephant/elephant.glb

          # molochdadev Bear — CC BY 4.0, mobile-optimized GLB with attribution in source repo.
          curl -L --fail --retry 3 \
            -o public/models/external/bear.glb \
            https://raw.githubusercontent.com/yinasaurus/hack-for-humanity/f6b696a45da7b75aa8f1321dda694e7fea30a6f5/mobile/assets/characters/bear.glb

          ls -lh public/models/external

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
